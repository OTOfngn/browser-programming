<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Weather Dashboard</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<nav>
    <button id="btnTheme">Change theme</button>
    <button id="btnHome" onclick="window.location.href='index.html'">Home</button>
</nav>

<body>

    <h1>Weather Dashboard</h1>

    <p>This page loads current weather data from a public API.</p>

    <button id="btnLoadWeather">Load Weather</button>

    <div id="weatherBox">
        <p><strong>City:</strong> <span id="city">-</span></p>
        <p><strong>Temperature:</strong> <span id="temperature">-</span></p>
        <p><strong>Wind Speed:</strong> <span id="wind">-</span></p>
    </div>

    <pre id="output"></pre>

    <script src="weather.js"></script>
</body>

</html>
